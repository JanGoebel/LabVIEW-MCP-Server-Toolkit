name: Pull Request Review

# For every pull request against main: runs the Caraya suite and the
# protocol tester against a running test server, creates a graphical diff of
# the changed VIs, posts all of it as one comment on the pull request, and
# builds an installable test package.
# Publishing stays in release.yml.
#
# Lives in tools/ci as pull-request.workflow.yml; copy it to
# .github/workflows/pull-request.yml on main to activate it.

on:
  pull_request:
    branches:
      - main

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every run step goes through Windows PowerShell with the execution policy
# bypassed for that process only. A fresh Windows machine allows no scripts
# (policy Restricted), which stopped every step with PSSecurityException; this
# way the runner needs no Set-ExecutionPolicy. The runner still writes the step
# as a .ps1 file, stops on errors and passes $LASTEXITCODE on, as with the
# built-in "powershell" shell.
defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

env:
  # Which LabVIEW runs what is decided per job by tools/ci/Resolve-CiEnvironment.ps1
  # (step "Find LabVIEW and Tools"), which writes LABVIEW_PATH/_PORT/_VERSION/
  # _BITNESS and LABVIEW_COMPARE_PATH/_PORT/_VERSION/_BITNESS for the following
  # steps. Without repository variables it picks:
  #   tests and build: the oldest LabVIEW of at least 2020, 64-bit preferred;
  #   VI comparison:   the newest LabVIEW, 32-bit preferred at equal version.
  # The comparison needs a LabVIEW at least as new as LabVIEW CLI, and one
  # nobody develops in: a LabVIEW that has MCP Server.lvlib loaded from another
  # checkout refuses the pull request's copy (error 1051, "already exists in
  # memory"). The ports come from each LabVIEW.ini, or from the running
  # instance; VI Server is enabled and port clashes are repaired.
  # The repository variables below are requests: a path that does not exist
  # on the runner, or a port LabVIEW does not use, is reported and replaced.
  # A pull request needs the diff: when it cannot be produced for every
  # changed VI, the run fails (after posting the report).
  REQUESTED_LABVIEW_PATH: ${{ vars.LABVIEW_PATH }}
  REQUESTED_LABVIEW_PORT: ${{ vars.LABVIEW_PORT }}
  REQUESTED_COMPARE_PATH: ${{ vars.LABVIEW_COMPARE_PATH }}
  REQUESTED_COMPARE_PORT: ${{ vars.LABVIEW_COMPARE_PORT }}

jobs:
  # ==========================================
  # JOB 1: TESTS + DIFF REPORT
  # ==========================================
  review:
    # The runner is self-hosted and the repo is public: only run for branches
    # of this repository, never for pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    # The first run on a fresh runner installs the VIPM packages into two
    # LabVIEW versions, which takes far longer than a normal run.
    timeout-minutes: 75
    permissions:
      contents: write        # pushes the diff images to pr-assets/pr-<number>
      pull-requests: write   # posts the report comment
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the diff needs the history of both branches

      # The report scripts come from main, not from the pull request, so a
      # pull request cannot change how its own report is produced.
      - name: Checkout Report Scripts from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: _ci
          sparse-checkout: |
            tools/ci
            tools/setup

      # Picks the LabVIEW for the tests and the one for the VI comparison, their
      # VI Server ports and the tools, repairs what is easy to repair (VI
      # Server off, port clashes, leftover LabVIEW CLI processes) and lists it
      # all in the job summary. See the comment at env above.
      # The scripts come from main. While main does not have the scripts this
      # workflow calls yet (in the run of the pull request that introduces
      # them), this run uses the pull request's own tools\ci and tools\setup
      # instead, with a warning; this job only runs for branches of this
      # repository. Later steps then call the same copies through _ci.
      - name: Find LabVIEW and Tools
        run: |
          $ci = "$env:GITHUB_WORKSPACE\_ci"
          if (-not (Test-Path "$ci\tools\ci\Resolve-CiEnvironment.ps1")) {
            Write-Host "::warning::main has no tools/ci/Resolve-CiEnvironment.ps1 yet; this run uses the scripts of the pull request."
            foreach ($dir in 'tools\ci', 'tools\setup') {
              New-Item -ItemType Directory -Force "$ci\$dir" | Out-Null
              Copy-Item "$env:GITHUB_WORKSPACE\$dir\*" "$ci\$dir" -Recurse -Force
            }
          }
          & "$ci\tools\ci\Resolve-CiEnvironment.ps1" -For All -Fix

      # Installs the packages the toolkit and its tests need into both LabVIEWs
      # chosen above, so a fresh runner needs no manual setup and the diff
      # draws JSONtext, Caraya and IG subVIs instead of "?" placeholders.
      # The script comes from main; the package lists (src\*.vipc and
      # tools\setup\test-packages.txt) come from the pull request, so a pull
      # request that adds a dependency is tested with it. VIPM skips packages
      # that are already installed. VIPM Desktop must have detected the
      # LabVIEW installations once (see tools/setup/README.md).
      - name: Install VIPM Dependencies
        timeout-minutes: 45
        run: |
          $install = "$env:GITHUB_WORKSPACE\_ci\tools\setup\Install-Dependencies.ps1"
          & $install -LabVIEWVersion $env:LABVIEW_VERSION -Bitness $env:LABVIEW_BITNESS -RepoDir "$env:GITHUB_WORKSPACE"
          if ($env:LABVIEW_COMPARE_PATH -ne $env:LABVIEW_PATH) {
            & $install -LabVIEWVersion $env:LABVIEW_COMPARE_VERSION -Bitness $env:LABVIEW_COMPARE_BITNESS -RepoDir "$env:GITHUB_WORKSPACE"
          }

      # Invoke-CliTest.ps1 exits 0 (passed), 1 (tests failed), 2 (LabVIEW not
      # reachable, nothing ran) or 3 (entry VI missing on this branch). The
      # status goes into the report, so an unreachable LabVIEW is not reported
      # as failed tests.
      - name: Run Caraya Test Suite
        id: tests
        continue-on-error: true
        run: |
          $report = "$env:GITHUB_WORKSPACE\tests\results\caraya-report.txt"
          if (Test-Path $report) { Remove-Item $report }
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Invoke-CliTest.ps1" `
            -VIPath "$env:GITHUB_WORKSPACE\tests\Run_Tests_CLI.vi" `
            -LabVIEWPath "$env:LABVIEW_PATH" -PortNumber $env:LABVIEW_PORT
          $status = $LASTEXITCODE
          "status=$status" >> $env:GITHUB_OUTPUT
          if ($status -ne 0) { exit 1 }

      # Starts the toolkit's test server and runs tools\test\Test-McpServer.ps1
      # against it over HTTP. Skipped when LabVIEW was not reachable above.
      - name: Run Protocol Tests
        id: protocol
        if: always() && steps.tests.outputs.status != '2'
        continue-on-error: true
        run: |
          $report = "$env:GITHUB_WORKSPACE\tests\results\protocol-report.txt"
          if (Test-Path $report) { Remove-Item $report }
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Invoke-CliTest.ps1" `
            -VIPath "$env:GITHUB_WORKSPACE\tests\Run_Protocol_Tests_CLI.vi" `
            -LabVIEWPath "$env:LABVIEW_PATH" -PortNumber $env:LABVIEW_PORT
          $status = $LASTEXITCODE
          "status=$status" >> $env:GITHUB_OUTPUT
          # A branch without the entry VI is not a failure.
          if ($status -ne 0 -and $status -ne 3) { exit 1 }
          exit 0

      - name: Build Test Report
        if: always()
        run: |
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Convert-CarayaReport.ps1" `
            -ReportPath "$env:GITHUB_WORKSPACE\tests\results\caraya-report.txt" `
            -OutFile "$env:RUNNER_TEMP\test-report.md" `
            -TestStatus "${{ steps.tests.outputs.status }}" `
            -ProtocolReportPath "$env:GITHUB_WORKSPACE\tests\results\protocol-report.txt" `
            -ProtocolStatus "${{ steps.protocol.outputs.status }}"
          Get-Content "$env:RUNNER_TEMP\test-report.md" | Add-Content $env:GITHUB_STEP_SUMMARY

      # Exits 1 when a changed VI could not be compared (LabVIEW not
      # reachable, comparison error). The report is still written and posted;
      # the last step then fails the run.
      - name: Build VI Diff Report
        id: diff
        if: always()
        continue-on-error: true
        run: |
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\New-ViDiffReport.ps1" `
            -BaseRef "origin/${{ github.event.pull_request.base.ref }}" `
            -HeadDir "$env:GITHUB_WORKSPACE" `
            -OutDir "$env:RUNNER_TEMP\vi-diff" `
            -LabVIEWPath "$env:LABVIEW_COMPARE_PATH" -PortNumber $env:LABVIEW_COMPARE_PORT
          exit $LASTEXITCODE

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-reports-pr-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/test-report.md
            ${{ runner.temp }}/vi-diff
          retention-days: 14

      - name: Post Report on the Pull Request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Publish-PrReport.ps1" `
            -PrNumber ${{ github.event.pull_request.number }} `
            -Repo "${{ github.repository }}" `
            -RepoDir "$env:GITHUB_WORKSPACE" `
            -TestReport "$env:RUNNER_TEMP\test-report.md" `
            -DiffDir "$env:RUNNER_TEMP\vi-diff" `
            -Footer "Report for commit ${{ github.event.pull_request.head.sha }}. The installable test package is under Artifacts of [this run]($runUrl) once the build job has finished."

      - name: Fail if the Tests or the VI Diff Failed
        if: steps.tests.outcome == 'failure' || steps.protocol.outcome == 'failure' || steps.diff.outcome == 'failure'
        run: |
          if ("${{ steps.tests.outputs.status }}" -eq '2') {
            Write-Host "::error::LabVIEW was not reachable on port $env:LABVIEW_PORT; no tests ran."
          }
          if ("${{ steps.diff.outcome }}" -eq 'failure') {
            Write-Host "::error::The VI diff could not be produced for every changed VI (LabVIEW $env:LABVIEW_COMPARE_PATH, port $env:LABVIEW_COMPARE_PORT). A pull request needs it; see the report."
          }
          Write-Host "::error::Caraya suite: ${{ steps.tests.outcome }}, protocol tests: ${{ steps.protocol.outcome }}, VI diff: ${{ steps.diff.outcome }}."
          exit 1

  # ==========================================
  # JOB 2: TEST BUILD (only if the tests pass)
  # ==========================================
  test-build:
    needs: review
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@v4

      - name: Checkout Report Scripts from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: _ci
          sparse-checkout: tools/ci

      # Same choice of LabVIEW as in the review job (a job starts with a fresh
      # environment): the build uses the test LabVIEW and finds vipm.
      # Same fallback to the pull request's scripts as in the review job.
      - name: Find LabVIEW and Tools
        run: |
          $ci = "$env:GITHUB_WORKSPACE\_ci"
          if (-not (Test-Path "$ci\tools\ci\Resolve-CiEnvironment.ps1")) {
            Write-Host "::warning::main has no tools/ci/Resolve-CiEnvironment.ps1 yet; this run uses the scripts of the pull request."
            New-Item -ItemType Directory -Force "$ci\tools\ci" | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\tools\ci\*" "$ci\tools\ci" -Recurse -Force
          }
          & "$ci\tools\ci\Resolve-CiEnvironment.ps1" -For Test

      - name: Build VI Package via VIPM CLI
        timeout-minutes: 25
        env:
          VIPM_CLI_TIMEOUT: 1200
        run: |
          $vipbFile = "$env:GITHUB_WORKSPACE\src\LabVIEW MCP Server SDK.vipb"
          # Read and write the .vipb as UTF-8: VIPM rejects a file that is not valid UTF-8.
          $vipbContent = [System.IO.File]::ReadAllLines($vipbFile)

          # Keep major.minor.patch from the .vipb and use the run number as the
          # build number, so every test build gets its own installable version.
          $current = ($vipbContent | Select-String "<Library_Version>(\d+)\.(\d+)\.(\d+)\.\d+</Library_Version>").Matches[0]
          $newVersion = "$($current.Groups[1].Value).$($current.Groups[2].Value).$($current.Groups[3].Value).${{ github.run_number }}"
          Write-Host "Test build version: $newVersion"
          $vipbContent = $vipbContent -replace "<Library_Version>.*?</Library_Version>", "<Library_Version>$newVersion</Library_Version>"

          $notes = "Test build of pull request #${{ github.event.pull_request.number }} (commit ${{ github.event.pull_request.head.sha }}). Not a release."
          $vipbContent = $vipbContent -replace "<Release_Notes>.*?</Release_Notes>", "<Release_Notes>$notes</Release_Notes>"

          [System.IO.File]::WriteAllLines($vipbFile, $vipbContent, (New-Object System.Text.UTF8Encoding $false))

          # The build's LabVIEW version becomes the package's minimum version;
          # the step above warns when that is not LabVIEW 2020 64-bit.
          Write-Host "Building VI Package with LabVIEW $env:LABVIEW_VERSION $env:LABVIEW_BITNESS-bit..."
          vipm build "$vipbFile" --labview-version $env:LABVIEW_VERSION --labview-bitness $env:LABVIEW_BITNESS

          if ($LASTEXITCODE -ne 0) {
            Write-Error "VIPM CLI build failed with exit code $LASTEXITCODE."
            exit 1
          }
          "### Test package built: version $newVersion" >> $env:GITHUB_STEP_SUMMARY

      - name: Locate Built VIP Artifact
        run: |
          # builds\ is where the .vipb puts it; search the whole checkout in case
          # the output folder was changed, and fail clearly if there is none.
          $vipFile = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter *.vip -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vipFile) { Write-Host '::error::The build produced no .vip file.'; exit 1 }
          Write-Host "Package: $($vipFile.FullName)"
          echo "VIP_PATH=$($vipFile.FullName)" >> $env:GITHUB_ENV

      - name: Upload Test Package
        uses: actions/upload-artifact@v4
        with:
          name: test-vip-package-pr-${{ github.event.pull_request.number }}
          path: ${{ env.VIP_PATH }}
          retention-days: 14
