name: Pull Request Review

# For every pull request against main: runs the Caraya suite and the
# protocol tester against a running test server, creates a graphical diff of
# the changed VIs, posts all of it as one comment on the pull request, and
# builds an installable test package.
# Publishing stays in release.yml.
#
# Lives in tools/ci as pull-request.workflow.yml; copy it to
# .github/workflows/pull-request.yml on main to activate it.

on:
  pull_request:
    branches:
      - main

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # LabVIEW used for the tests on the self-hosted runner. The VI Server port
  # differs per machine (see tools/setup/README.md): it is server.tcp.port in
  # that LabVIEW's LabVIEW.ini. The repository variable LABVIEW_PORT overrides
  # the default; release.yml reads the same variable.
  LABVIEW_PATH: C:\Program Files\National Instruments\LabVIEW 2020\LabVIEW.exe
  LABVIEW_PORT: ${{ vars.LABVIEW_PORT || '3365' }}
  # LabVIEW used for the VI comparison. The comparison operation belongs to
  # the installed LabVIEW CLI and needs a LabVIEW at least as new as that CLI;
  # with LabVIEW 2020 it fails to load, so there is no fallback to the test
  # LabVIEW. Without these two repository variables the diff is skipped and
  # the report says so.
  LABVIEW_COMPARE_PATH: ${{ vars.LABVIEW_COMPARE_PATH }}
  LABVIEW_COMPARE_PORT: ${{ vars.LABVIEW_COMPARE_PORT }}

jobs:
  # ==========================================
  # JOB 1: TESTS + DIFF REPORT
  # ==========================================
  review:
    # The runner is self-hosted and the repo is public: only run for branches
    # of this repository, never for pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: write        # pushes the diff images to pr-assets/pr-<number>
      pull-requests: write   # posts the report comment
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the diff needs the history of both branches

      # The report scripts come from main, not from the pull request, so a
      # pull request cannot change how its own report is produced.
      - name: Checkout Report Scripts from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: _ci
          sparse-checkout: tools/ci

      # Invoke-CliTest.ps1 exits 0 (passed), 1 (tests failed), 2 (LabVIEW not
      # reachable, nothing ran) or 3 (entry VI missing on this branch). The
      # status goes into the report, so an unreachable LabVIEW is not reported
      # as failed tests.
      - name: Run Caraya Test Suite
        id: tests
        continue-on-error: true
        run: |
          $report = "$env:GITHUB_WORKSPACE\tests\results\caraya-report.txt"
          if (Test-Path $report) { Remove-Item $report }
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Invoke-CliTest.ps1" `
            -VIPath "$env:GITHUB_WORKSPACE\tests\Run_Tests_CLI.vi" `
            -LabVIEWPath "$env:LABVIEW_PATH" -PortNumber $env:LABVIEW_PORT
          $status = $LASTEXITCODE
          "status=$status" >> $env:GITHUB_OUTPUT
          if ($status -ne 0) { exit 1 }

      # Starts the toolkit's test server and runs tools\test\Test-McpServer.ps1
      # against it over HTTP. Skipped when LabVIEW was not reachable above.
      - name: Run Protocol Tests
        id: protocol
        if: always() && steps.tests.outputs.status != '2'
        continue-on-error: true
        run: |
          $report = "$env:GITHUB_WORKSPACE\tests\results\protocol-report.txt"
          if (Test-Path $report) { Remove-Item $report }
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Invoke-CliTest.ps1" `
            -VIPath "$env:GITHUB_WORKSPACE\tests\Run_Protocol_Tests_CLI.vi" `
            -LabVIEWPath "$env:LABVIEW_PATH" -PortNumber $env:LABVIEW_PORT
          $status = $LASTEXITCODE
          "status=$status" >> $env:GITHUB_OUTPUT
          # A branch without the entry VI is not a failure.
          if ($status -ne 0 -and $status -ne 3) { exit 1 }
          exit 0

      - name: Build Test Report
        if: always()
        run: |
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Convert-CarayaReport.ps1" `
            -ReportPath "$env:GITHUB_WORKSPACE\tests\results\caraya-report.txt" `
            -OutFile "$env:RUNNER_TEMP\test-report.md" `
            -TestStatus "${{ steps.tests.outputs.status }}" `
            -ProtocolReportPath "$env:GITHUB_WORKSPACE\tests\results\protocol-report.txt" `
            -ProtocolStatus "${{ steps.protocol.outputs.status }}"
          Get-Content "$env:RUNNER_TEMP\test-report.md" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Build VI Diff Report
        if: always()
        run: |
          $outDir = "$env:RUNNER_TEMP\vi-diff"
          if (-not $env:LABVIEW_COMPARE_PATH -or -not $env:LABVIEW_COMPARE_PORT) {
            New-Item -ItemType Directory -Force $outDir | Out-Null
            $note = "## VI diff report`n`nSkipped: no LabVIEW for the comparison is configured. Set the repository variables LABVIEW_COMPARE_PATH and LABVIEW_COMPARE_PORT (a LabVIEW at least as new as the LabVIEW CLI, see tools/setup/README.md).`n"
            [System.IO.File]::WriteAllText("$outDir\report.md", $note, (New-Object System.Text.UTF8Encoding $false))
            Write-Host "::warning::VI diff skipped: LABVIEW_COMPARE_PATH / LABVIEW_COMPARE_PORT are not set."
            exit 0
          }
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\New-ViDiffReport.ps1" `
            -BaseRef "origin/${{ github.event.pull_request.base.ref }}" `
            -HeadDir "$env:GITHUB_WORKSPACE" `
            -OutDir $outDir `
            -LabVIEWPath "$env:LABVIEW_COMPARE_PATH" -PortNumber $env:LABVIEW_COMPARE_PORT

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-reports-pr-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/test-report.md
            ${{ runner.temp }}/vi-diff
          retention-days: 14

      - name: Post Report on the Pull Request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Publish-PrReport.ps1" `
            -PrNumber ${{ github.event.pull_request.number }} `
            -Repo "${{ github.repository }}" `
            -RepoDir "$env:GITHUB_WORKSPACE" `
            -TestReport "$env:RUNNER_TEMP\test-report.md" `
            -DiffDir "$env:RUNNER_TEMP\vi-diff" `
            -Footer "Report for commit ${{ github.event.pull_request.head.sha }}. The installable test package is under Artifacts of [this run]($runUrl) once the build job has finished."

      - name: Fail if the Tests Failed
        if: steps.tests.outcome == 'failure' || steps.protocol.outcome == 'failure'
        run: |
          if ("${{ steps.tests.outputs.status }}" -eq '2') {
            Write-Error "LabVIEW was not reachable on port $env:LABVIEW_PORT; no tests ran."
          } else {
            Write-Error "Caraya suite: ${{ steps.tests.outcome }}, protocol tests: ${{ steps.protocol.outcome }}."
          }
          exit 1

  # ==========================================
  # JOB 2: TEST BUILD (only if the tests pass)
  # ==========================================
  test-build:
    needs: review
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@v4

      - name: Build VI Package via VIPM CLI
        timeout-minutes: 25
        env:
          VIPM_CLI_TIMEOUT: 1200
        run: |
          $vipbFile = "$env:GITHUB_WORKSPACE\src\LabVIEW MCP Server SDK.vipb"
          # Read and write the .vipb as UTF-8: VIPM rejects a file that is not valid UTF-8.
          $vipbContent = [System.IO.File]::ReadAllLines($vipbFile)

          # Keep major.minor.patch from the .vipb and use the run number as the
          # build number, so every test build gets its own installable version.
          $current = ($vipbContent | Select-String "<Library_Version>(\d+)\.(\d+)\.(\d+)\.\d+</Library_Version>").Matches[0]
          $newVersion = "$($current.Groups[1].Value).$($current.Groups[2].Value).$($current.Groups[3].Value).${{ github.run_number }}"
          Write-Host "Test build version: $newVersion"
          $vipbContent = $vipbContent -replace "<Library_Version>.*?</Library_Version>", "<Library_Version>$newVersion</Library_Version>"

          $notes = "Test build of pull request #${{ github.event.pull_request.number }} (commit ${{ github.event.pull_request.head.sha }}). Not a release."
          $vipbContent = $vipbContent -replace "<Release_Notes>.*?</Release_Notes>", "<Release_Notes>$notes</Release_Notes>"

          [System.IO.File]::WriteAllLines($vipbFile, $vipbContent, (New-Object System.Text.UTF8Encoding $false))

          Write-Host "Building VI Package..."
          vipm build "$vipbFile" --labview-version 2020 --labview-bitness 64

          if ($LASTEXITCODE -ne 0) {
            Write-Error "VIPM CLI build failed with exit code $LASTEXITCODE."
            exit 1
          }
          "### Test package built: version $newVersion" >> $env:GITHUB_STEP_SUMMARY

      - name: Locate Built VIP Artifact
        run: |
          $vipFile = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\builds" | Where-Object { $_.Extension -eq ".vip" } | Select-Object -First 1
          echo "VIP_PATH=$($vipFile.FullName)" >> $env:GITHUB_ENV

      - name: Upload Test Package
        uses: actions/upload-artifact@v4
        with:
          name: test-vip-package-pr-${{ github.event.pull_request.number }}
          path: ${{ env.VIP_PATH }}
          retention-days: 14
