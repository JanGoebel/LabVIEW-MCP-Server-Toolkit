name: Pull Request Review

# For every pull request against main: runs the Caraya suite and the
# protocol tester against a running test server, creates a graphical diff of
# the changed VIs, posts all of it as one comment on the pull request, and
# builds an installable test package.
# Publishing stays in release.yml.
#
# Lives in tools/ci as pull-request.workflow.yml; copy it to
# .github/workflows/pull-request.yml on main to activate it.
#
# Values from the event or from earlier steps reach the scripts through env:,
# never pasted into a run: block with ${{ }}, so a branch name or a step
# output cannot change the script. Files the runner reads after a step
# (GITHUB_OUTPUT, GITHUB_ENV, GITHUB_STEP_SUMMARY) are written as UTF-8
# without BOM.

on:
  pull_request:
    branches:
      - main

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every run step goes through Windows PowerShell with the execution policy
# bypassed for that process only. A fresh Windows machine allows no scripts
# (policy Restricted), which stopped every step with PSSecurityException; this
# way the runner needs no Set-ExecutionPolicy. The runner still writes the step
# as a .ps1 file, stops on errors and passes $LASTEXITCODE on, as with the
# built-in "powershell" shell.
defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

env:
  # Which LabVIEW runs what is decided per job by tools/ci/Resolve-CiEnvironment.ps1
  # (step "Find LabVIEW and Tools"), which writes LABVIEW_PATH/_PORT/_VERSION/
  # _BITNESS and LABVIEW_COMPARE_PATH/_PORT/_VERSION/_BITNESS for the following
  # steps. Without repository variables it picks:
  #   tests and build: the oldest LabVIEW of at least 2020, 64-bit preferred;
  #   VI comparison:   the newest LabVIEW, 32-bit preferred at equal version.
  # The comparison needs a LabVIEW at least as new as LabVIEW CLI, and one
  # nobody develops in: a LabVIEW that has MCP Server.lvlib loaded from another
  # checkout refuses the pull request's copy (error 1051, "already exists in
  # memory"). The ports come from each LabVIEW.ini, or from the running
  # instance; VI Server is enabled and port clashes are repaired.
  # The repository variables below are requests: a path that does not exist
  # on the runner, or a port LabVIEW does not use, is reported and replaced.
  # A pull request needs the diff: when it cannot be produced for every
  # changed VI, the run fails (after posting the report).
  REQUESTED_LABVIEW_PATH: ${{ vars.LABVIEW_PATH }}
  REQUESTED_LABVIEW_PORT: ${{ vars.LABVIEW_PORT }}
  REQUESTED_COMPARE_PATH: ${{ vars.LABVIEW_COMPARE_PATH }}
  REQUESTED_COMPARE_PORT: ${{ vars.LABVIEW_COMPARE_PORT }}

jobs:
  # ==========================================
  # JOB 1: TESTS + DIFF REPORT
  # ==========================================
  review:
    # The runner is self-hosted and the repo is public: only run for branches
    # of this repository, never for pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    # The first run on a fresh runner installs the VIPM packages into two
    # LabVIEW versions, which takes far longer than a normal run.
    timeout-minutes: 75
    permissions:
      contents: write        # pushes the diff images to pr-assets/pr-<number>
      pull-requests: write   # posts the report comment
    steps:
      # persist-credentials: false leaves no token in .git/config, where the
      # pull request's own code (tests, VIs, the protocol tester) could read
      # it. Only the step that publishes the report gets the token, as
      # GH_TOKEN; Publish-PrReport.ps1 pushes with it.
      - name: Checkout Pull Request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0     # the diff needs the history of both branches
          persist-credentials: false

      # The report scripts come from main, not from the pull request, so a
      # change to them takes effect only once it is merged.
      - name: Checkout Report Scripts from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: _ci
          persist-credentials: false
          sparse-checkout: |
            tools/ci
            tools/setup

      # Picks the LabVIEW for the tests and the one for the VI comparison, their
      # VI Server ports and the tools, repairs what is easy to repair (VI
      # Server off, port clashes, leftover LabVIEW CLI processes, and with
      # -CleanStart a VIPM Desktop left over from an earlier job together with
      # the test and comparison LabVIEWs it was driving, never another LabVIEW
      # and none with unsaved changes unless CI_DEDICATED_MACHINE=1) and lists
      # it all in the job summary. See the comment at env above.
      # The scripts come from main. While main does not have the scripts this
      # workflow calls yet (in the run of the pull request that introduces
      # them), this run uses the pull request's own tools\ci and tools\setup
      # instead, with a warning; this job only runs for branches of this
      # repository. Later steps then call the same copies through _ci.
      - name: Find LabVIEW and Tools
        id: setup
        run: |
          $ci = "$env:GITHUB_WORKSPACE\_ci"
          if (-not (Test-Path "$ci\tools\ci\Resolve-CiEnvironment.ps1")) {
            Write-Host "::warning::main has no tools/ci/Resolve-CiEnvironment.ps1 yet; this run uses the scripts of the pull request."
            foreach ($dir in 'tools\ci', 'tools\setup') {
              New-Item -ItemType Directory -Force "$ci\$dir" | Out-Null
              Copy-Item "$env:GITHUB_WORKSPACE\$dir\*" "$ci\$dir" -Recurse -Force
            }
          }
          & "$ci\tools\ci\Resolve-CiEnvironment.ps1" -For All -Fix -CleanStart

      # Installs the packages the toolkit and its tests need into both LabVIEWs
      # chosen above, so a fresh runner needs no manual setup and the diff
      # draws JSONtext, Caraya and IG subVIs instead of "?" placeholders.
      # The script comes from main; the package lists (src\*.vipc and
      # tools\setup\test-packages.txt) come from the pull request, so a pull
      # request that adds a dependency is tested with it. VIPM skips packages
      # that are already installed. VIPM Desktop must have detected the
      # LabVIEW installations once (see tools/setup/README.md).
      - name: Install VIPM Dependencies
        id: install
        timeout-minutes: 45
        run: |
          $install = "$env:GITHUB_WORKSPACE\_ci\tools\setup\Install-Dependencies.ps1"
          & $install -LabVIEWVersion $env:LABVIEW_VERSION -Bitness $env:LABVIEW_BITNESS -RepoDir "$env:GITHUB_WORKSPACE"
          if ($env:LABVIEW_COMPARE_PATH -ne $env:LABVIEW_PATH) {
            & $install -LabVIEWVersion $env:LABVIEW_COMPARE_VERSION -Bitness $env:LABVIEW_COMPARE_BITNESS -RepoDir "$env:GITHUB_WORKSPACE"
          }

      # VIPM starts a LabVIEW to install packages, on the port VIPM has
      # recorded for it, and may leave it running. Look at the LabVIEWs and
      # ports again, so the tests and the diff reach the LabVIEW they mean;
      # the values written here replace the ones from the first check.
      - name: Check LabVIEW after Package Install
        id: recheck
        run: |
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Resolve-CiEnvironment.ps1" -For All -Fix

      # The steps below run only when the three steps above succeeded (the
      # default condition, or an explicit check of their outcome), so none of
      # them runs with empty LABVIEW_* values; a step that did not run is
      # reported as "not run" in the report and by the last step.

      # The suite runs only the tests Test_MCP_Server.vi calls. Fails when a
      # "test *.vi" of the test library is not called, so a test that was
      # added but not wired in is not skipped without notice. Reads files
      # only, no LabVIEW. Falls back to the pull request's copy while main
      # does not have the script yet.
      - name: Check that Every Test VI Is Called
        id: wired
        continue-on-error: true
        run: |
          $script = "$env:GITHUB_WORKSPACE\_ci\tools\ci\Test-TestsWired.ps1"
          if (-not (Test-Path $script)) { $script = "$env:GITHUB_WORKSPACE\tools\ci\Test-TestsWired.ps1" }
          & $script -RepoDir "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      # Invoke-CliTest.ps1 exits 0 (passed), 1 (tests failed), 2 (LabVIEW not
      # reachable, nothing ran) or 3 (entry VI missing on this branch). The
      # status goes into the report, so an unreachable LabVIEW is not reported
      # as failed tests.
      - name: Run Caraya Test Suite
        id: tests
        continue-on-error: true
        run: |
          $report = "$env:GITHUB_WORKSPACE\tests\results\caraya-report.txt"
          if (Test-Path $report) { Remove-Item $report }
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Invoke-CliTest.ps1" `
            -VIPath "$env:GITHUB_WORKSPACE\tests\Run_Tests_CLI.vi" `
            -LabVIEWPath "$env:LABVIEW_PATH" -PortNumber $env:LABVIEW_PORT
          $status = $LASTEXITCODE
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "status=$status`n")
          if ($status -ne 0) { exit 1 }

      # Starts the toolkit's test server and runs tools\test\Test-McpServer.ps1
      # against it over HTTP. Skipped when LabVIEW was not reachable above.
      - name: Run Protocol Tests
        id: protocol
        if: ${{ !cancelled() && steps.recheck.outcome == 'success' && steps.tests.outputs.status != '2' }}
        continue-on-error: true
        run: |
          $report = "$env:GITHUB_WORKSPACE\tests\results\protocol-report.txt"
          if (Test-Path $report) { Remove-Item $report }
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Invoke-CliTest.ps1" `
            -VIPath "$env:GITHUB_WORKSPACE\tests\Run_Protocol_Tests_CLI.vi" `
            -LabVIEWPath "$env:LABVIEW_PATH" -PortNumber $env:LABVIEW_PORT
          $status = $LASTEXITCODE
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "status=$status`n")
          # A branch without the entry VI is not a failure.
          if ($status -ne 0 -and $status -ne 3) { exit 1 }
          exit 0

      # A skipped test step becomes "not-run" in the report. A protocol step
      # skipped because LabVIEW was not reachable (status 2) gets no section,
      # as the test section already says so.
      - name: Build Test Report
        if: ${{ !cancelled() }}
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TESTS_STATUS: ${{ steps.tests.outputs.status }}
          PROTOCOL_OUTCOME: ${{ steps.protocol.outcome }}
          PROTOCOL_STATUS: ${{ steps.protocol.outputs.status }}
        run: |
          $testStatus = if ($env:TESTS_OUTCOME -eq 'skipped') { 'not-run' } else { $env:TESTS_STATUS }
          $protocolStatus = if ($env:PROTOCOL_OUTCOME -eq 'skipped' -and $env:TESTS_STATUS -ne '2') { 'not-run' } else { $env:PROTOCOL_STATUS }
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Convert-CarayaReport.ps1" `
            -ReportPath "$env:GITHUB_WORKSPACE\tests\results\caraya-report.txt" `
            -OutFile "$env:RUNNER_TEMP\test-report.md" `
            -TestStatus $testStatus `
            -ProtocolReportPath "$env:GITHUB_WORKSPACE\tests\results\protocol-report.txt" `
            -ProtocolStatus $protocolStatus
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, [System.IO.File]::ReadAllText("$env:RUNNER_TEMP\test-report.md"))

      # Exits 1 when a changed VI could not be compared (LabVIEW not
      # reachable, comparison error). The report is still written and posted;
      # the last step then fails the run. Needs the comparison LabVIEW from
      # the first step; it also runs when the package install failed (the
      # diagrams then show "?" for missing subVIs), but not when the check
      # after the install failed.
      - name: Build VI Diff Report
        id: diff
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.recheck.outcome != 'failure' }}
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\New-ViDiffReport.ps1" `
            -BaseRef "origin/$env:BASE_REF" `
            -HeadDir "$env:GITHUB_WORKSPACE" `
            -OutDir "$env:RUNNER_TEMP\vi-diff" `
            -LabVIEWPath "$env:LABVIEW_COMPARE_PATH" -PortNumber $env:LABVIEW_COMPARE_PORT
          exit $LASTEXITCODE

      - name: Upload Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-reports-pr-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/test-report.md
            ${{ runner.temp }}/vi-diff
          retention-days: 14

      # The only step with the token: Publish-PrReport.ps1 pushes the images
      # with it (the checkout keeps no credentials) and posts the comment.
      - name: Post Report on the Pull Request
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: |
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $footer = "Report for commit $env:HEAD_SHA. The installable test package is under Artifacts of [this run]($runUrl) once the build job has finished."
          if ($env:DIFF_OUTCOME -eq 'skipped') {
            $footer = "**VI diff: not run**, because finding LabVIEW and the tools failed; see [this run]($runUrl).`n`n" + $footer
          }
          & "$env:GITHUB_WORKSPACE\_ci\tools\ci\Publish-PrReport.ps1" `
            -PrNumber $env:PR_NUMBER `
            -Repo "$env:GITHUB_REPOSITORY" `
            -RepoDir "$env:GITHUB_WORKSPACE" `
            -TestReport "$env:RUNNER_TEMP\test-report.md" `
            -DiffDir "$env:RUNNER_TEMP\vi-diff" `
            -Footer $footer

      - name: Fail if the Tests or the VI Diff Failed
        if: ${{ !cancelled() && (steps.setup.outcome != 'success' || steps.install.outcome != 'success' || steps.recheck.outcome != 'success' || steps.tests.outcome == 'failure' || steps.protocol.outcome == 'failure' || steps.diff.outcome != 'success' || steps.wired.outcome == 'failure') }}
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RECHECK_OUTCOME: ${{ steps.recheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TESTS_STATUS: ${{ steps.tests.outputs.status }}
          PROTOCOL_OUTCOME: ${{ steps.protocol.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          WIRED_OUTCOME: ${{ steps.wired.outcome }}
        run: |
          function Format-Outcome([string]$Outcome) { if ($Outcome -eq 'skipped' -or -not $Outcome) { 'not run' } else { $Outcome } }
          if ($env:SETUP_OUTCOME -ne 'success' -or $env:INSTALL_OUTCOME -ne 'success' -or $env:RECHECK_OUTCOME -ne 'success') {
            Write-Host "::error::Finding LabVIEW and tools: $(Format-Outcome $env:SETUP_OUTCOME), package install: $(Format-Outcome $env:INSTALL_OUTCOME), check after the install: $(Format-Outcome $env:RECHECK_OUTCOME). The steps that need them did not run."
          }
          if ($env:TESTS_STATUS -eq '2') {
            Write-Host "::error::LabVIEW was not reachable on port $env:LABVIEW_PORT; no tests ran."
          }
          if ($env:DIFF_OUTCOME -eq 'failure') {
            Write-Host "::error::The VI diff could not be produced for every changed VI (LabVIEW $env:LABVIEW_COMPARE_PATH, port $env:LABVIEW_COMPARE_PORT). A pull request needs it; see the report."
          } elseif ($env:DIFF_OUTCOME -ne 'success') {
            Write-Host "::error::The VI diff did not run. A pull request needs it."
          }
          Write-Host "::error::Caraya suite: $(Format-Outcome $env:TESTS_OUTCOME), protocol tests: $(Format-Outcome $env:PROTOCOL_OUTCOME), VI diff: $(Format-Outcome $env:DIFF_OUTCOME), test wiring: $(Format-Outcome $env:WIRED_OUTCOME)."
          exit 1

  # ==========================================
  # JOB 2: TEST BUILD (only if the tests pass)
  # ==========================================
  test-build:
    needs: review
    # Same fork guard as the review job, stated here too so this job never
    # runs code of a fork on the self-hosted runner, whatever "needs" does.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout Pull Request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout Report Scripts from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: _ci
          persist-credentials: false
          sparse-checkout: tools/ci

      # Same choice of LabVIEW as in the review job (a job starts with a fresh
      # environment): the build uses the test LabVIEW and finds vipm.
      # Same fallback to the pull request's scripts as in the review job.
      - name: Find LabVIEW and Tools
        run: |
          $ci = "$env:GITHUB_WORKSPACE\_ci"
          if (-not (Test-Path "$ci\tools\ci\Resolve-CiEnvironment.ps1")) {
            Write-Host "::warning::main has no tools/ci/Resolve-CiEnvironment.ps1 yet; this run uses the scripts of the pull request."
            New-Item -ItemType Directory -Force "$ci\tools\ci" | Out-Null
            Copy-Item "$env:GITHUB_WORKSPACE\tools\ci\*" "$ci\tools\ci" -Recurse -Force
          }
          & "$ci\tools\ci\Resolve-CiEnvironment.ps1" -For Test -Fix -CleanStart

      - name: Build VI Package via VIPM CLI
        timeout-minutes: 50
        env:
          VIPM_CLI_TIMEOUT: 2400
          # vipm gives up after 60 s without progress from VIPM Desktop by
          # default ("made no progress ... may be stuck", exit code 124).
          # A build of this package in LabVIEW 2020 takes about 23 minutes on
          # the runner, and its last phase reports nothing for about 10 of
          # them; with 600 s the build failed or passed depending on a few
          # seconds. 25 minutes of silence still ends a VIPM that really hangs.
          VIPM_DESKTOP_LIVELINESS_TIMEOUT: 1500
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $vipbFile = "$env:GITHUB_WORKSPACE\src\LabVIEW MCP Server SDK.vipb"
          # Read and write the .vipb as UTF-8: VIPM rejects a file that is not valid UTF-8.
          $vipbContent = [System.IO.File]::ReadAllLines($vipbFile)

          # Keep major.minor.patch from the .vipb and use the run number as the
          # build number, so every test build gets its own installable version.
          $current = ($vipbContent | Select-String "<Library_Version>(\d+)\.(\d+)\.(\d+)\.\d+</Library_Version>").Matches[0]
          $newVersion = "$($current.Groups[1].Value).$($current.Groups[2].Value).$($current.Groups[3].Value).$env:GITHUB_RUN_NUMBER"
          Write-Host "Test build version: $newVersion"
          $vipbContent = $vipbContent -replace "<Library_Version>.*?</Library_Version>", "<Library_Version>$newVersion</Library_Version>"

          $notes = "Test build of pull request #$env:PR_NUMBER (commit $env:HEAD_SHA). Not a release."
          $vipbContent = $vipbContent -replace "<Release_Notes>.*?</Release_Notes>", "<Release_Notes>$notes</Release_Notes>"

          [System.IO.File]::WriteAllLines($vipbFile, $vipbContent, (New-Object System.Text.UTF8Encoding $false))

          # The build's LabVIEW version becomes the package's minimum version;
          # the step above warns when that is not LabVIEW 2020 64-bit.
          Write-Host "Building VI Package with LabVIEW $env:LABVIEW_VERSION $env:LABVIEW_BITNESS-bit..."
          vipm build "$vipbFile" --labview-version $env:LABVIEW_VERSION --labview-bitness $env:LABVIEW_BITNESS

          if ($LASTEXITCODE -ne 0) {
            Write-Error "VIPM CLI build failed with exit code $LASTEXITCODE."
            exit 1
          }
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "### Test package built: version $newVersion`n")

      - name: Locate Built VIP Artifact
        run: |
          # builds\ is where the .vipb puts it; search the whole checkout in case
          # the output folder was changed, and fail clearly if there is none.
          $vipFile = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter *.vip -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vipFile) { Write-Host '::error::The build produced no .vip file.'; exit 1 }
          Write-Host "Package: $($vipFile.FullName)"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "VIP_PATH=$($vipFile.FullName)`n")

      - name: Upload Test Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-vip-package-pr-${{ github.event.pull_request.number }}
          path: ${{ env.VIP_PATH }}
          retention-days: 14

      # Installs the package just built into the test LabVIEW, checks that it
      # contains no tools\, _ci\, tests\, .git or .ps1 entries and no override
      # the build renamed, starts each INSTALLED example (<LabVIEW>\examples\
      # MCP Server\...) in turn, runs tools\test\Test-McpServer.ps1 against
      # it, closes the test LabVIEW after each (an example's Stop button
      # cannot be pressed from outside) and uninstalls the package. The tester
      # comes from the pull request; the script from main, or from the pull
      # request while main does not have it.
      - name: Test Installed Package
        timeout-minutes: 45
        env:
          VIPM_CLI_TIMEOUT: 1200
          VIPM_DESKTOP_LIVELINESS_TIMEOUT: 900
        run: |
          $script = "$env:GITHUB_WORKSPACE\_ci\tools\ci\Test-InstalledPackage.ps1"
          if (-not (Test-Path $script)) { $script = "$env:GITHUB_WORKSPACE\tools\ci\Test-InstalledPackage.ps1" }
          $reportFile = "$env:RUNNER_TEMP\installed-package-report.txt"
          & $script -VipPath "$env:VIP_PATH" -RepoDir "$env:GITHUB_WORKSPACE" `
            -LabVIEWPath "$env:LABVIEW_PATH" -PortNumber $env:LABVIEW_PORT `
            -ReportFile $reportFile
          $status = $LASTEXITCODE
          $report = if (Test-Path $reportFile) { [System.IO.File]::ReadAllText($reportFile).TrimEnd() } else { '(no report written)' }
          $fence = '````'
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "### Installed package test`n$fence`n$report`n$fence`n")
          exit $status
