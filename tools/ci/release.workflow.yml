name: Test, Build and Release MCP Toolkit

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'test-*'

# Read-only by default; only the job that creates the release may write.
permissions:
  contents: read

# Every run step goes through Windows PowerShell with the execution policy
# bypassed for that process only, so the runner needs no Set-ExecutionPolicy.
# Same as in pull-request.workflow.yml.
defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

env:
  # The LabVIEW for tests and build is chosen per job by
  # tools/ci/Resolve-CiEnvironment.ps1 (step "Find LabVIEW and Tools"): the
  # oldest LabVIEW of at least 2020 on the runner, 64-bit preferred, with its
  # VI Server port from its LabVIEW.ini or the running instance. It writes
  # LABVIEW_PATH, LABVIEW_PORT, LABVIEW_VERSION and LABVIEW_BITNESS for the
  # following steps. The repository variables are requests; one that does not
  # fit the runner is reported and replaced. Same as pull-request.yml.
  REQUESTED_LABVIEW_PATH: ${{ vars.LABVIEW_PATH }}
  REQUESTED_LABVIEW_PORT: ${{ vars.LABVIEW_PORT }}

jobs:
  # ==========================================
  # JOB 1: TEST (Runs on EVERY push)
  # ==========================================
  test:
    runs-on: self-hosted
    # The first run on a fresh runner installs the VIPM packages.
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Find LabVIEW and Tools
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\Resolve-CiEnvironment.ps1" -For Test -Fix -CleanStart

      # Installs src\*.vipc and tools\setup\test-packages.txt into the LabVIEW
      # chosen above, which runs the tests here and builds the package in the
      # next job on the same runner. VIPM skips packages already installed.
      - name: Install VIPM Dependencies
        timeout-minutes: 45
        run: |
          & "$env:GITHUB_WORKSPACE\tools\setup\Install-Dependencies.ps1" -LabVIEWVersion $env:LABVIEW_VERSION -Bitness $env:LABVIEW_BITNESS

      # VIPM may leave LabVIEW running on the port it has recorded for it;
      # check again before the tests (same as pull-request.yml).
      - name: Check LabVIEW after Package Install
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\Resolve-CiEnvironment.ps1" -For Test -Fix

      # Invoke-CliTest.ps1 exits 1 when tests failed and 2 when LabVIEW could
      # not be reached, so the log says which of the two happened.
      - name: Run Caraya Test Suite
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\Invoke-CliTest.ps1" `
            -VIPath "$env:GITHUB_WORKSPACE\tests\Run_Tests_CLI.vi" `
            -LabVIEWPath "$env:LABVIEW_PATH" -PortNumber $env:LABVIEW_PORT
          if ($LASTEXITCODE -ne 0) { Write-Error "Blocking the build."; exit 1 }

      # tools\test\Test-McpServer.ps1 against the toolkit's test server.
      - name: Run Protocol Tests
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\Invoke-CliTest.ps1" `
            -VIPath "$env:GITHUB_WORKSPACE\tests\Run_Protocol_Tests_CLI.vi" `
            -LabVIEWPath "$env:LABVIEW_PATH" -PortNumber $env:LABVIEW_PORT
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:GITHUB_WORKSPACE\tests\results\protocol-report.txt" -ErrorAction SilentlyContinue
            Write-Error "Blocking the build."
            exit 1
          }
  # ==========================================
  # JOB 2: BUILD (Runs ONLY on Tags, and ONLY if Tests pass)
  # ==========================================
  build-and-release:
    needs: test    # <--- This is the magic line. It waits for JOB 1.
    if: startsWith(github.ref, 'refs/tags/') # <--- Only build if it's a tag!
    runs-on: self-hosted
    # The "release" environment holds the job until a required reviewer
    # (the maintainer) approves it, and its deployment rules can limit it to
    # v* tags. The environment is created in the repository settings.
    environment: release
    permissions:
      contents: write   # creates the GitHub release and uploads the .vip

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0     # the check below needs the history of main
          fetch-tags: true   # <--- CRITICAL: Tells GitHub to download the tag annotations!

      # A release is built only from a commit that is on main, that is one
      # that went through a reviewed pull request: a v* tag on any other
      # commit fails here, before anything is built. test-* tags build a
      # test package only (no release) and may point anywhere.
      - name: Check that the Tag Is on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::Could not fetch main from origin.'; exit 1 }
          $commit = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $commit refs/remotes/origin/main
          $code = $LASTEXITCODE
          if ($code -eq 1) {
            Write-Host "::error::Tag $env:TAG_NAME points to $commit, which is not on main. Releases are built only from commits on main."
            exit 1
          }
          if ($code -ne 0) { Write-Host "::error::git merge-base --is-ancestor failed with exit code $code."; exit 1 }
          Write-Host "Tag $env:TAG_NAME ($commit) is on main."

      # Same LabVIEW as the test job (a job starts with a fresh environment).
      - name: Find LabVIEW and Tools
        run: |
          & "$env:GITHUB_WORKSPACE\tools\ci\Resolve-CiEnvironment.ps1" -For Test -Fix -CleanStart

      - name: Build VI Package via VIPM CLI
        timeout-minutes: 50
        env:
          VIPM_CLI_TIMEOUT: 2400
          # vipm gives up after 60 s without progress from VIPM Desktop by
          # default ("made no progress ... may be stuck", exit code 124).
          # A build of this package in LabVIEW 2020 takes about 23 minutes on
          # the runner, and its last phase reports nothing for about 10 of
          # them; with 600 s the build failed or passed depending on a few
          # seconds. 25 minutes of silence still ends a VIPM that really hangs.
          VIPM_DESKTOP_LIVELINESS_TIMEOUT: 1500
          # Passed through the environment, not pasted into the script: a
          # commit message or tag name with quotes or $ would otherwise break
          # or change it.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $vipbFile = "$env:GITHUB_WORKSPACE\src\LabVIEW MCP Server SDK.vipb"
          # git writes UTF-8; without this Windows PowerShell reads a tag
          # message in the console code page and garbles non-ASCII text.
          try { [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding $false } catch { }

          $gitTag = $env:TAG_NAME
          Write-Host "Detected Tag: $gitTag"

          # 1. Extract the Annotated Tag Message using the Git CLI.
          #    actions/checkout recreates the tag as a lightweight tag on the
          #    commit, so %(contents) would return the commit message. Fetch
          #    the real tag object first.
          git fetch --quiet --force --no-tags origin "refs/tags/${gitTag}:refs/tags/${gitTag}"
          if ($LASTEXITCODE -ne 0) { Write-Error "Fetching tag $gitTag failed."; exit 1 }
          $tagMsg = ""
          if ((git cat-file -t "refs/tags/$gitTag") -eq "tag") {
            # Subject and body only: %(contents) would also include the
            # signature block of a signed tag.
            $tagMsg = ((git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' $gitTag) -join "`n").Trim()
          }

          # 2. Fallback to the commit message if the tag was left blank
          if ([string]::IsNullOrWhiteSpace($tagMsg)) {
            $tagMsg = "$env:HEAD_COMMIT_MESSAGE"
            Write-Host "No tag message found. Falling back to commit message."
          } else {
            Write-Host "Found annotated tag message!"
          }

          Write-Host "Release Notes to use:`n$tagMsg"

          # Hand the same text to the GitHub release step (UTF-8 without BOM)
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($notesFile, $tagMsg, (New-Object System.Text.UTF8Encoding $false))

          # 3. Update the Version Number (Only if it's a 'v' release tag)
          # Read and write the .vipb as UTF-8: VIPM rejects a file that is not
          # valid UTF-8, and Get-Content/Set-Content use the ANSI code page in
          # Windows PowerShell.
          $vipbContent = [System.IO.File]::ReadAllLines($vipbFile)

          # Anchored: a test-* tag that contains a number (test-1.2.3) keeps
          # the version of the .vipb.
          if ($gitTag -match '^v(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$') {
            $major = $matches[1]
            $minor = $matches[2]
            $patch = $matches[3]
            $build = if ($matches[4]) { $matches[4] } else { 0 }

            $newVersion = "$major.$minor.$patch.$build"
            Write-Host "Updating VIPB to version: $newVersion"
            $vipbContent = $vipbContent -replace "<Library_Version>.*?</Library_Version>", "<Library_Version>$newVersion</Library_Version>"
          }

          # 4. Inject the Release Notes into the VIPB
          #    -replace reads $_, $& and $1 in the replacement text as
          #    substitutions, so double every $ to keep the message as written.
          $safeMsg = [System.Security.SecurityElement]::Escape($tagMsg).Replace('$', '$$')
          $vipbContent = $vipbContent -replace "<Release_Notes>.*?</Release_Notes>", "<Release_Notes>$safeMsg</Release_Notes>"

          [System.IO.File]::WriteAllLines($vipbFile, $vipbContent, (New-Object System.Text.UTF8Encoding $false))

          # 5. Run the build with the LabVIEW chosen above (as the pull request
          # test builds do). Its version becomes the package's minimum LabVIEW
          # version; the step above warns when that is not LabVIEW 2020 64-bit.
          Write-Host "Building VI Package with LabVIEW $env:LABVIEW_VERSION $env:LABVIEW_BITNESS-bit..."
          vipm build "$vipbFile" --labview-version $env:LABVIEW_VERSION --labview-bitness $env:LABVIEW_BITNESS

          if ($LASTEXITCODE -ne 0) {
            Write-Error "VIPM CLI build failed with exit code $LASTEXITCODE."
            exit 1
          }

      - name: Locate Built VIP Artifact
        id: find_vip
        run: |
          # builds\ is where the .vipb puts it; search the whole checkout in case
          # the output folder was changed, and fail clearly if there is none.
          $vipFile = Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Filter *.vip -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $vipFile) { Write-Host '::error::The build produced no .vip file.'; exit 1 }
          Write-Host "Package: $($vipFile.FullName)"
          # UTF-8 without BOM, which the runner reads (">>" writes UTF-16).
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "VIP_PATH=$($vipFile.FullName)`n")

      - name: Upload Artifact for Testing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-vip-package
          path: ${{ env.VIP_PATH }}

      - name: Create GitHub Release and Upload VIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ env.VIP_PATH }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
